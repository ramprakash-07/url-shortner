<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>URL Shortener</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="page">
      <h1>URL Shortener</h1>

      <form id="shorten-form" class="panel">
        <h2>Create a short link</h2>
        <label for="url-input">URL</label>
        <input id="url-input" type="url" placeholder="https://example.com" required>
        <label for="key-input">Custom key (optional)</label>
        <input id="key-input" type="text" placeholder="my-link">
        <button type="submit">Shorten URL</button>
      </form>

      <p id="form-message" class="message"></p>

      <form id="delete-form" class="panel">
        <h2>Delete a short link</h2>
        <label for="short-url-input">Shortened URL or key</label>
        <input id="short-url-input" type="text" placeholder="https://kuttyurl.vercel.app/abc123" required>
        <button type="submit" class="danger">Delete URL</button>
      </form>
      <p id="delete-message" class="message"></p>
    </main>

  <script type="module" src="script.js"></script>
</body>
</html>
